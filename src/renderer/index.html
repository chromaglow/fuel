<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>fuel</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="phase-offline">
    <main id="hud">
      <header>
        <div id="model">—</div>
        <div id="status">connecting…</div>
      </header>

      <div id="gauge-wrap">
        <canvas id="gauge" width="240" height="240"></canvas>
        <div id="center">
          <div id="usd">≈&nbsp;$0.00</div>
          <div id="usd-label">budget preserved</div>
          <div id="tokens">0 tok</div>
        </div>
        <div id="tps">— tok/s</div>
      </div>

      <footer>
        <span id="hw">⬡ —</span>
        <span id="unburned"></span>
        <span id="ctx"></span>
      </footer>

      <section id="panel" aria-hidden="true">
        <div class="rows" id="panel-rows"></div>
        <div class="sub">recent</div>
        <div class="tasks" id="panel-tasks"></div>
        <div class="sub">toll booth</div>
        <div class="catch" id="panel-catch"></div>
        <div class="tasks" id="panel-receipts"></div>
        <div class="sub" id="nudge-heading">unburned fuel</div>
        <div class="tasks" id="panel-nudges"></div>
      </section>
    </main>
    <script type="module" src="./hud.ts"></script>
  </body>
</html>
