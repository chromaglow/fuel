<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>fuel · Fx Studio</title>
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body>
    <main id="studio">
      <aside id="stage">
        <header class="stage-head">
          <h1>Fx Studio</h1>
          <p class="muted">Changes apply to the gauge as you make them.</p>
        </header>

        <div id="preview-card">
          <div id="preview-wrap">
            <canvas id="preview" width="240" height="240"></canvas>
            <div id="p-center">
              <div id="p-usd">≈ $0.00</div>
              <div id="p-label">budget preserved</div>
            </div>
          </div>
        </div>

        <div class="sim">
          <label class="sim-row">
            <span>Today</span>
            <input id="sim-usd" type="range" min="0" max="80" step="0.01" value="6.40" />
            <output id="sim-usd-out">$6.40</output>
          </label>
          <div class="sim-row">
            <span>The card is</span>
            <div class="seg" id="sim-phase">
              <button type="button" data-phase="working" class="is-on">working</button>
              <button type="button" data-phase="idle">idle</button>
            </div>
          </div>
          <div class="sim-buttons">
            <button type="button" id="sim-add">+$0.25</button>
            <button type="button" id="sim-lap">Complete a lap</button>
            <button type="button" id="sim-tier">Next tier</button>
            <button type="button" id="sim-milestone">Milestone</button>
            <button type="button" id="sim-reset">Back to $0</button>
          </div>
          <p class="muted small">The preview is a sandbox: its dollars aren't real. Laps are $2, tiers start at $12, milestones are $10, $25, $50, $100 and up.</p>
        </div>
      </aside>

      <section id="controls">
        <div class="top">
          <label class="master"><input type="checkbox" id="master" /> <span>Effects on</span> <span class="muted">(off is Calm)</span></label>
          <div class="presets" id="presets"></div>
          <button type="button" id="defaults" class="ghost">Reset to defaults</button>
        </div>
        <div id="sections"></div>
      </section>
    </main>
    <script type="module" src="./studio.ts"></script>
  </body>
</html>
